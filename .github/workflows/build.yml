# Единый бинарник QuickAsk под Linux, Windows и macOS (PyInstaller, packaging/quickask.spec).
# На каждый push/PR — сборка и smoke-тест; на тег v* — ещё и релиз с бинарниками.
name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: linux-${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-24.04, arch: x86_64 }
          - { runner: ubuntu-24.04-arm, arch: aarch64 }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: GTK4 и PyGObject из системы
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            python3-venv python3-gi gir1.2-gtk-4.0 libgtk-4-1 adwaita-icon-theme \
            libpython3.12t64                 # PyInstaller вшивает libpython3.12.so — на голой Ubuntu её нет

      # в Ubuntu 24.04 gtk4-layer-shell не пакетирован — собираем из исходников
      - name: gtk4-layer-shell
        run: |
          sudo packaging/build-gtk4-layer-shell.sh 1.3.0
          python3 -c "import gi; gi.require_version('Gtk4LayerShell', '1.0'); from gi.repository import Gtk4LayerShell as L; print('gtk4-layer-shell', L.get_major_version(), L.get_minor_version(), L.get_micro_version())"

      - name: PyInstaller
        run: |
          python3 -m venv --system-site-packages .venv   # PyGObject — системный, из apt
          .venv/bin/pip install pyinstaller pyinstaller-hooks-contrib

      - name: Сборка
        run: .venv/bin/pyinstaller --noconfirm --clean packaging/quickask.spec

      - name: Smoke-тест
        env:
          SMOKE_REQUIRE_LAYER_SHELL: "1"     # без него окно не будет поверх всего и не встанет по margin_top
        run: .venv/bin/python packaging/smoke.py dist/quickask

      # Smoke-тест выше идёт там же, где сборка: недостающую в бинарнике библиотеку он не заметит,
      # она подхватится из системы. Здесь — чистая Ubuntu, где из графики есть только то, что
      # PyInstaller намеренно берёт с хоста (Wayland, EGL, GL — их версии должны совпадать с драйвером).
      - name: Smoke-тест на чистой системе
        run: |
          docker run --rm -v "$PWD":/w -w /w ubuntu:24.04 sh -c '
            apt-get update -qq && apt-get install -y -qq --no-install-recommends \
              python3 libwayland-client0 libwayland-cursor0 libwayland-egl1 libegl1 libgl1 >/dev/null
            SMOKE_REQUIRE_LAYER_SHELL=1 python3 packaging/smoke.py dist/quickask'

      - run: mv dist/quickask dist/quickask-linux-${{ matrix.arch }}

      - uses: actions/upload-artifact@v4
        with:
          name: quickask-linux-${{ matrix.arch }}
          path: dist/quickask-linux-${{ matrix.arch }}
          if-no-files-found: error

  windows:
    name: windows-x86_64
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4

      # GTK4 под Windows живёт в MSYS2 — оттуда же Python и PyGObject.
      # PyInstaller в MSYS2 не пакетирован: ставим из PyPI в venv, как на Linux и macOS.
      # Готовые win_amd64-колёса к mingw-Python не подходят, pip соберёт его из исходников — нужен gcc.
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-gtk4
            mingw-w64-ucrt-x86_64-adwaita-icon-theme
            mingw-w64-ucrt-x86_64-python
            mingw-w64-ucrt-x86_64-python-gobject
            mingw-w64-ucrt-x86_64-python-pip

      - name: PyInstaller
        run: |
          python -m venv --system-site-packages .venv   # PyGObject — из MSYS2
          VPY="$(ls .venv/*/python.exe | head -1)"      # у mingw-Python venv бывает и bin/, и Scripts/
          "$VPY" -m pip install pyinstaller pyinstaller-hooks-contrib

      - name: Сборка
        run: |
          VPY="$(ls .venv/*/python.exe | head -1)"
          "$VPY" -m PyInstaller --noconfirm --clean packaging/quickask.spec

      - name: Smoke-тест
        run: |
          VPY="$(ls .venv/*/python.exe | head -1)"
          "$VPY" packaging/smoke.py dist/quickask.exe

      - run: mv dist/quickask.exe dist/quickask-windows-x86_64.exe

      - uses: actions/upload-artifact@v4
        with:
          name: quickask-windows-x86_64
          path: dist/quickask-windows-x86_64.exe
          if-no-files-found: error

  macos:
    name: macos-arm64
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: GTK4 и PyGObject из Homebrew
        run: brew install gtk4 pygobject3 adwaita-icon-theme

      - name: PyInstaller
        run: |
          # тот Python, под который собран pygobject3, — иначе gi не найдётся
          PYVER="$(brew deps pygobject3 | grep -m1 '^python@' | cut -d@ -f2)"
          "$(brew --prefix)/bin/python$PYVER" -m venv --system-site-packages .venv
          .venv/bin/pip install pyinstaller pyinstaller-hooks-contrib

      - name: Сборка
        run: .venv/bin/pyinstaller --noconfirm --clean packaging/quickask.spec

      - name: Smoke-тест
        run: .venv/bin/python packaging/smoke.py dist/quickask

      - run: mv dist/quickask dist/quickask-macos-arm64

      - uses: actions/upload-artifact@v4
        with:
          name: quickask-macos-arm64
          path: dist/quickask-macos-arm64
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, windows, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      # LGPL требует прикладывать к бинарникам тексты лицензий вшитых библиотек.
      # LGPL-3 — дополнение к GPL-3, поэтому нужен и её текст.
      - name: Лицензии
        run: |
          {
            cat packaging/THIRD_PARTY_NOTICES.md
            for l in LGPL-2.1 LGPL-3 GPL-2 GPL-3 Apache-2.0; do
              printf '\n\n%s\n%s\n%s\n\n' "================================================================" "$l" \
                     "================================================================"
              cat "/usr/share/common-licenses/$l"
            done
          } > dist/THIRD_PARTY_LICENSES.txt
          cp LICENSE dist/LICENSE

      - name: Контрольные суммы
        working-directory: dist
        run: |
          chmod +x quickask-linux-* quickask-macos-*
          sha256sum quickask-* > SHA256SUMS

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
