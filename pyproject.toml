[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "quickask"
dynamic = ["version"]
description = "Всплывающее окно к LLM для Wayland: стрим ответа, Markdown, инструменты через MCP, фоновые агенты в Docker"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
# GTK4 и (опционально) gtk4-layer-shell ставятся системным пакетным менеджером — см. README
dependencies = ["PyGObject>=3.48"]

[project.optional-dependencies]
build = ["pyinstaller>=6.10", "pyinstaller-hooks-contrib>=2024.8"]

[project.scripts]
quickask = "quickask.__main__:main"

[project.urls]
Homepage = "https://github.com/delarun/quickask"

[tool.setuptools]
package-dir = { "" = "src", "mcps" = "mcps" }
packages = ["quickask", "quickask.sdk", "quickask.ui", "mcps"]

[tool.setuptools.dynamic]
version = { attr = "quickask.__version__" }
